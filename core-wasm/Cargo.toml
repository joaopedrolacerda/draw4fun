[package]
name = "draw4fun-core-wasm"
description = "Ponte do núcleo do draw4fun para o navegador (wasm-bindgen)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
draw4fun-core = { path = "../core" }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
